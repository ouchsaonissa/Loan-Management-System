services:
  mysql:
    image: mysql:8.0
    container_name: loan-management-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: loan_management
    volumes:
      - loan_mysql_data:/var/lib/mysql

  backend:
    image: ouchsaonisa/loan-management-backend:latest
    container_name: loan-management-backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/loan_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-immediately}

  frontend:
    image: ouchsaonisa/loan-management-frontend:latest
    container_name: loan-management-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  loan_mysql_data:
